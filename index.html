<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numbers</title>
<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f16;
  color:#f5f7fb;
}

body.memberPoolOpen{overflow:hidden;}

header{
  padding:10px 18px;
  background:#101722;
  border-bottom:1px solid #273244;
  position:sticky;
  top:0;
  z-index:20;
}

h2,h3{margin:8px 0;}

.headerInner{
  max-width:1500px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.headerAuth{
  position:relative;
  margin-left:auto;
}
.loginToggleBtn{
  padding:8px 11px;
  border-radius:9px;
  white-space:nowrap;
}
.headerLogin{
  display:flex;
  align-items:stretch;
  gap:7px;
  flex-direction:column;
}
.loginPopover{
  display:none;
  position:absolute;
  right:0;
  top:calc(100% + 8px);
  width:min(310px,calc(100vw - 20px));
  padding:10px;
  background:#121a26;
  border:1px solid #273244;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  z-index:50;
}
.loginPopover.open{display:flex;}
.headerLogin input{width:100%;margin:0;padding:8px 9px;}
.loginActions{display:flex;gap:6px;}
.loginActions button{flex:1;padding:8px 10px;}
#loginStatus{font-size:11px;opacity:.75;white-space:nowrap;}

.wrap{
  padding:12px;
  max-width:1500px;
  margin:auto;
  display:grid;
  grid-template-columns:270px minmax(0,1fr);
  gap:12px;
  align-items:start;
}

.panel{
  background:#121a26;
  border:1px solid #273244;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

#rosterPanel{
  position:sticky;
  top:74px;
  max-height:calc(100vh - 86px);
  display:flex;
  flex-direction:column;
  margin-bottom:0;
}

.rosterHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.closeRosterBtn,
.memberPoolBtn,
.drawerBackdrop{
  display:none;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
}

.bulkUpdate{
  display:flex;
  gap:7px;
  align-items:stretch;
  margin:7px 0;
}

.bulkUpdate textarea{
  flex:1;
  min-width:0;
  min-height:48px;
  resize:vertical;
  background:#1a2330;
  color:#f5f7fb;
  border:1px solid #334155;
  border-radius:8px;
  padding:7px 8px;
}

input,select,button{
  background:#1a2330;
  color:#f5f7fb;
  border:1px solid #334155;
  border-radius:8px;
  padding:7px 8px;
  font-size:12px;
}

input::placeholder,.bulkUpdate textarea::placeholder{color:#718096;}
button{cursor:pointer;}
button:hover{background:#243247;}

#members{
  display:flex;
  flex-direction:column;
  gap:3px;
  max-height:calc(100vh - 320px);
  min-height:180px;
  overflow-y:auto;
  padding:6px 2px;
  margin-top:4px;
}

.member{
  width:100%;
  min-width:0;
  background:#182230;
  border:1px solid #2d3b50;
  border-radius:7px;
  padding:5px 6px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:6px;
}

.member.sel{
  outline:2px solid #4da3ff;
  background:#172b42;
}

.member small{color:#9aa7b8;}
.class-Lord-Knight{color:#ff7676!important;}
.class-Paladin{color:#ffd166!important;}
.class-High-Wizard{color:#70a1ff!important;}
.class-High-Priest{color:#ff8ed4!important;}
.class-Sniper{color:#7bed9f!important;}
.class-Assassin-Cross{color:#c792ea!important;}
.class-Whitesmith{color:#ffa502!important;}
.class-Nightwatch{color:#74b9ff!important;}
.class-Alithea{color:#55efc4!important;}
.class-Champion{color:#ffb86c!important;}

.memberBtns{display:flex;gap:3px;margin-top:0;}
.memberBtns button{padding:4px 6px;font-size:10px;}

.memberStatus{
  display:inline-block;
  margin-top:4px;
  padding:2px 6px;
  border-radius:10px;
  font-size:10px;
  font-weight:bold;
}
.statusMain{background:#1e4f80;color:#8ecbff;}
.statusSub{background:#4a3275;color:#d2b6ff;}
.statusNone{background:#303846;color:#aab4c3;}


.rosterViewFilters{
  display:flex;
  gap:5px;
  margin:6px 0 2px;
  flex-wrap:wrap;
}
.rosterViewFilters button{
  padding:5px 8px;
  font-size:10px;
}
.rosterViewFilters button.active{
  background:#6c5ce7;
  border-color:#6c5ce7;
  color:#fff;
  font-weight:bold;
}


.actionBar{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:0 0 10px;
}
.actionBar button{padding:7px 10px;font-size:11px;}
.actionBar .danger{border-color:#71343d;color:#ff9aa6;}
.actionBar .accent{background:#2b3d57;}

.team.healerMissing{border-color:#ff7676;box-shadow:0 0 0 1px rgba(255,118,118,.18) inset;}
.healerBadge{font-size:9px;color:#ff9aa6;font-weight:800;margin-left:6px;white-space:nowrap;}
.teamMeta{display:flex;align-items:center;gap:6px;}

body.poolHiddenDesktop .wrap{grid-template-columns:minmax(0,1fr);}
body.poolHiddenDesktop #rosterPanel{display:none;}
body.poolHiddenDesktop .memberPoolBtn{display:inline-block;}

@media print{
  body{background:#fff;color:#000;}
  header,#rosterPanel,.memberPoolBtn,.drawerBackdrop,.tabs,.statsBar,.actionBar,#loginBox{display:none!important;}
  .wrap{display:block!important;max-width:none!important;padding:0!important;}
  .panel{border:0!important;background:#fff!important;padding:0!important;}
  .battlefieldScroll{overflow:visible!important;}
  .teams{min-width:0!important;grid-template-columns:1fr 2fr 1fr!important;gap:8px!important;}
  .team,.slot{background:#fff!important;color:#000!important;border-color:#999!important;break-inside:avoid;}
  .slot .removeMini,.slotEmpty{display:none!important;}
  .laneTitle{color:#000!important;}
}
.statsBar{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin:0 0 10px;
}
.statCard{
  background:#101722;
  border:1px solid #2b3748;
  border-radius:10px;
  padding:8px 10px;
  min-width:0;
}
.statValue{
  display:block;
  font-size:17px;
  font-weight:800;
  line-height:1.1;
  color:#65d68a;
}
.statLabel{
  display:block;
  margin-top:3px;
  font-size:9px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#8e9bad;
}
.statCard.warning .statValue{color:#ff7676;}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.tabs button.active{
  background:#4da3ff;
  color:#07111f;
  border-color:#4da3ff;
  font-weight:bold;
}

.teams{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.team{
  background:#101722;
  border:1px solid #2b3748;
  border-radius:12px;
  padding:9px;
}
.teamHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:2px 3px 8px;
  font-size:14px;
}
.teamHeader span{color:#65d68a;font-size:12px;font-weight:bold;}
.slot{
  background:#182230;
  border:1px solid #2c394c;
  border-radius:7px;
  min-height:32px;
  margin:3px 0;
  padding:5px 7px;
}
.slot b{font-size:13px;}
.slot small{color:#9aa7b8;font-size:11px;}
.slot button{padding:5px 7px;font-size:11px;margin-top:4px;}


/* Battlefield lane layout: TOP 3 / MID 6 / BOTTOM 3 */
.teams{
  display:grid;
  grid-template-columns:minmax(220px,1fr) minmax(460px,2fr) minmax(220px,1fr);
  gap:12px;
  align-items:start;
}
.lane{
  min-width:0;
}
.laneTitle{
  text-align:center;
  font-size:15px;
  letter-spacing:.08em;
  margin:2px 0 8px;
  color:#dbe7f7;
}
.laneTeams{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.lane.mid .laneTeams{
  grid-template-columns:repeat(2,minmax(0,1fr));
}
.team{
  padding:7px;
}
.slot{
  display:block;
  min-height:40px;
  padding:5px 6px;
}
.slotTop,.slotBottom{display:flex;align-items:center;gap:6px;min-width:0;}
.slotTop{margin-bottom:3px;}
.slotClass{font-size:10px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slotName{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.slotGr{font-size:10px;opacity:.72;white-space:nowrap;margin-left:auto;}
.slotEmpty{width:100%;text-align:left;}
.slot .removeMini{padding:2px 6px;margin:0;font-size:10px;flex:0 0 auto;}

@media(min-width:701px){
  #rosterPanel h3{font-size:15px;}
  #rosterPanel .controls{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  #rosterPanel .controls input,
  #rosterPanel .controls select,
  #rosterPanel .controls button{width:100%;min-width:0;}
  #rosterPanel .bulkUpdate{display:grid;grid-template-columns:1fr;gap:5px;margin:5px 0;}
  #rosterPanel .bulkUpdate textarea{width:100%;min-height:46px;}
  #rosterPanel .member{font-size:12px;}
  #rosterPanel .member small{font-size:10px;}
  #rosterPanel .memberStatus{font-size:9px;padding:2px 5px;}
}


.subTeamsFlat{
  display:grid!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:10px!important;
  min-width:0!important;
}
@media(max-width:1000px){
  .subTeamsFlat{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
}
@media(max-width:700px){
  .subTeamsFlat{
    min-width:760px!important;
    grid-template-columns:repeat(3,240px)!important;
  }
}
@media(max-width:700px){
  header{padding:8px 10px;}
  header h2{font-size:18px;}
  .headerInner{align-items:center;flex-direction:row;gap:8px;}
  .headerAuth{margin-left:auto;}
  .loginToggleBtn{padding:7px 9px;font-size:12px;}
  .loginPopover{right:0;top:calc(100% + 7px);}


  .statsBar{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:6px;
  }
  .statValue{font-size:15px;}
  .statCard{padding:7px 8px;}

  .wrap{
    padding:8px;
    display:block;
  }

  .memberPoolBtn{
    display:inline-block;
    margin-bottom:8px;
  }

  .drawerBackdrop{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }

  body.memberPoolOpen .drawerBackdrop{
    opacity:1;
    pointer-events:auto;
  }

  #rosterPanel{
    position:fixed;
    top:0;
    left:0;
    width:min(84vw,340px);
    height:100dvh;
    max-height:none;
    margin:0;
    padding:12px;
    overflow:hidden;
    z-index:1000;
    transform:translateX(-105%);
    transition:transform .22s ease;
    border-radius:0 14px 14px 0;
    box-shadow:12px 0 30px rgba(0,0,0,.35);
  }

  body.memberPoolOpen #rosterPanel{transform:translateX(0);}

  .closeRosterBtn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    padding:0;
    font-size:18px;
    flex:0 0 auto;
  }

  #rosterPanel .controls input,
  #rosterPanel .controls select{
    flex:1 1 calc(50% - 7px);
    min-width:0;
    max-width:none;
  }

  #rosterPanel .controls button{
    flex:0 0 auto;
  }

  #rosterPanel .bulkUpdate{
    flex-direction:column;
  }

  #rosterPanel .bulkUpdate textarea{
    width:100%;
    min-height:54px;
  }

  #members{
    flex:1;
    min-height:0;
    max-height:none;
    overflow-y:auto;
    overscroll-behavior:contain;
  }

  .member{
    grid-template-columns:minmax(0,1fr) auto;
  }

  .memberBtns button{
    padding:5px 7px;
    font-size:10px;
  }

  .panel{padding:9px;}
  .teams{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
  .team{padding:6px;}
  .teamHeader{font-size:12px;}
  .slot{min-height:48px;padding:7px;}
}


@media(max-width:700px){
  .battlefieldScroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
  .teams{
    min-width:900px;
    grid-template-columns:220px 450px 220px;
    gap:8px;
  }
  .lane.mid .laneTeams{grid-template-columns:repeat(2,minmax(0,1fr));}
  .team{padding:6px;}
  .slot{min-height:32px;padding:4px 5px;}
}

@media(max-width:420px){
  .teams{grid-template-columns:220px 450px 220px;}
}


/* Guild League Attendance */
.moduleTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.moduleTabs button{padding:8px 12px;}
.moduleTabs button.active{background:#2f8cff;border-color:#2f8cff;color:white;}
.hiddenView{display:none!important;}
body.attendanceMode .wrap{grid-template-columns:minmax(0,1fr);}
body.attendanceMode #rosterPanel,body.attendanceMode .memberPoolBtn,body.attendanceMode .drawerBackdrop{display:none!important;}
.attendanceToolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.attendanceToolbar input,.attendanceToolbar button{min-height:36px;}
.attendanceStats{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px;margin:10px 0;}
.attendanceList{border:1px solid #263245;border-radius:10px;overflow:hidden;}
.attendanceRow{display:grid;grid-template-columns:minmax(180px,1.4fr) 150px 220px;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #223044;}
.attendanceRow:last-child{border-bottom:0;}
.attendanceMember small{display:block;opacity:.65;margin-top:2px;}
.attendanceStatus{font-size:12px;font-weight:700;}
.attendanceStatus.present{color:#5ee3a2;}
.attendanceStatus.absent{color:#ff7676;}
.attendanceStatus.unmarked{color:#9aa8bb;}
.attendanceActions{display:flex;gap:6px;justify-content:flex-end;}
.attendanceActions button{padding:6px 9px;font-size:12px;}
.attendanceActions .presentBtn.active{background:#155d43;border-color:#2dcf8b;}
.attendanceActions .absentBtn.active{background:#6a2630;border-color:#ff6577;}
.missedSummary{margin-top:14px;}
.missedGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;}
.missedItem{background:#0f1722;border:1px solid #243247;border-radius:8px;padding:8px;display:flex;justify-content:space-between;gap:8px;}
.missedItem strong{font-size:12px;}
.missedItem span{font-size:12px;color:#ff9b9b;}
@media(max-width:800px){
  .attendanceStats{grid-template-columns:repeat(2,minmax(0,1fr));}
  .attendanceRow{grid-template-columns:minmax(0,1fr);}
  .attendanceActions{justify-content:flex-start;}
}


.builderToolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 10px;
}
.builderToolbar .tabs,
.builderToolbar .actionBar{margin:0;}
.builderToolbar .actionBar{justify-content:flex-end;}
@media(max-width:700px){
  .builderToolbar{align-items:flex-start;flex-direction:column;gap:7px;}
  .builderToolbar .tabs,.builderToolbar .actionBar{width:100%;}
  .builderToolbar .actionBar{justify-content:flex-start;}
}

.viewerMode .officerOnly{opacity:.45;cursor:not-allowed;}
.viewerMode .officerOnly:disabled{filter:grayscale(.2);}
.viewOnlyBadge{font-size:11px;opacity:.75;margin-left:8px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

<header>
  <div class="headerInner">
    <h2>Numbers</h2>
    <div class="headerAuth">
      <button id="loginToggleBtn" class="loginToggleBtn" onclick="toggleLoginBox()">👤 Officer</button>
      <div id="loginBox" class="headerLogin loginPopover">
        <input id="loginEmail" type="email" placeholder="Officer email">
        <input id="loginPassword" type="password" placeholder="Password">
        <div class="loginActions">
          <button onclick="officerLogin()">Login</button>
          <button onclick="officerLogout()">Logout</button>
        </div>
        <span id="loginStatus">Not logged in</span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

<div class="drawerBackdrop" onclick="closeMemberPool()"></div>
<div class="panel" id="rosterPanel">
<div class="rosterHeader">
  <h3>Roster</h3>
  <button class="closeRosterBtn" onclick="closeMemberPool()" aria-label="Close Member Pool">✕</button>
</div>

<div class="controls" style="grid-template-columns:1fr;">
  <button class="accent" onclick="syncRosterFromSheet(true)">↻ Sync Google Sheet</button>
  <small id="sheetSyncStatus" style="opacity:.75">Roster source: Google Sheet</small>
</div>
<div class="controls">
<input id="search" placeholder="Search IGN" oninput="render()">

<select id="filter" onchange="render()">
<option value="">All Classes</option>
<option>Lord Knight</option>
<option>Paladin</option>
<option>High Wizard</option>
<option>High Priest</option>
<option>Sniper</option>
<option>Assassin Cross</option>
<option>Whitesmith</option>
<option>Nightwatch</option>
<option>Alithea</option>
<option>Champion</option>
</select>

<select id="sort" onchange="render()">
<option value="gr">Highest GR</option>
<option value="az">A-Z</option>
</select>
</div>

<div class="rosterViewFilters">
  <button id="viewAllBtn" class="active" onclick="setMemberViewFilter('all')">All</button>
  <button id="viewMainBtn" onclick="setMemberViewFilter('main')">Main</button>
  <button id="viewSubBtn" onclick="setMemberViewFilter('sub')">Sub</button>
  <button id="viewUnassignedBtn" onclick="setMemberViewFilter('unassigned')">Unassigned</button>
</div>

<div id="members"></div>
</div>

<div class="panel">
<div class="moduleTabs">
  <button id="builderModuleBtn" class="active" onclick="showModule('builder')">⚔️ Team Builder</button>
  <button id="attendanceModuleBtn" onclick="showModule('attendance')">📋 Guild League Attendance</button>
</div>

<div id="teamBuilderView">
<div class="builderToolbar">
  <div class="tabs battlefieldTabs">
    <button id="mainBtn" class="active" onclick="showTab('main')">Main Battlefield</button>
    <button id="subBtn" onclick="showTab('sub')">Sub Battlefield</button>
  </div>
  <div class="actionBar">
    <button class="accent officerOnly" onclick="autoFillCurrent()">⚡ Auto-fill Empty</button>
    <button id="saveTeamImageBtn" onclick="saveTeamImage()">📸 Save Team Image</button>
    <button onclick="toggleDesktopPool()">☰ Hide/Show List</button>
    <button id="clearCurrentBtn" class="danger officerOnly" onclick="clearCurrent()">Clear Main</button>
  </div>
</div>

<div class="statsBar" id="statsBar">
  <div class="statCard"><span class="statValue" id="statMembers">0</span><span class="statLabel">Members</span></div>
  <div class="statCard"><span class="statValue" id="statMain">0/60</span><span class="statLabel">Main</span></div>
  <div class="statCard"><span class="statValue" id="statSub">0</span><span class="statLabel">Sub</span></div>
  <div class="statCard"><span class="statValue" id="statUnassigned">0</span><span class="statLabel">Unassigned</span></div>
  <div class="statCard"><span class="statValue" id="statFullTeams">0</span><span class="statLabel">Full Teams</span></div>
  <div class="statCard" id="statNoHealerCard"><span class="statValue" id="statNoHealer">0</span><span class="statLabel">No Healer</span></div>
</div>

<div class="battlefieldScroll"><div class="teams" id="teams"></div></div>
</div>

<div id="attendanceView" class="hiddenView">
  <h3>📋 Guild League Attendance</h3>
  <div class="attendanceToolbar">
    <button onclick="changeAttendanceDate(-7)">← Previous</button>
    <input id="attendanceDate" type="date" onchange="renderAttendance()">
    <button onclick="changeAttendanceDate(7)">Next →</button>
    <input id="attendanceSearch" placeholder="Search member" oninput="renderAttendance()">
    <select id="attendanceClass" onchange="renderAttendance()">
      <option value="all">All Classes</option>
    </select>
    <button class="accent officerOnly" onclick="markAllAttendance('present')">✓ Mark All Present</button>
    <button class="officerOnly" onclick="markAllAttendance('absent')">✕ Mark All Absent</button>
    <button class="officerOnly" onclick="clearAttendanceDate()">Clear This Date</button>
  </div>

  <div class="attendanceStats">
    <div class="statCard"><span class="statValue" id="attMembers">0</span><span class="statLabel">Members</span></div>
    <div class="statCard"><span class="statValue" id="attPresent">0</span><span class="statLabel">Present</span></div>
    <div class="statCard"><span class="statValue" id="attAbsent">0</span><span class="statLabel">Absent</span></div>
    <div class="statCard"><span class="statValue" id="attUnmarked">0</span><span class="statLabel">Unmarked</span></div>
    <div class="statCard"><span class="statValue" id="attPerfect">0</span><span class="statLabel">Perfect Attendance</span></div>
  </div>

  <div class="attendanceList" id="attendanceList"></div>

  <div class="missedSummary">
    <h3>Missed Guild League Summary</h3>
    <small style="opacity:.7">Counts recorded absences across all saved Guild League dates.</small>
    <div class="missedGrid" id="missedGrid"></div>
  </div>
</div>

function normalizeClassName(cls){

function stableMemberId(name){
  // Deterministic positive integer from IGN, so assignments survive refreshes/devices.
  let h = 2166136261;
  const text = String(name || "").trim().toLowerCase();
  for(let i=0;i<text.length;i++){
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) + 1000000000;
}

function reconcileSubRoster(){
  // MAIN stays fixed at 12 x 5.
  if(!Array.isArray(data.main)) data.main = [];
  while(data.main.length < 12) data.main.push(Array(5).fill(null));
  data.main = data.main.slice(0,12).map(team => Array.from({length:5},(_,i) => team?.[i] ?? null));

  const validIds = new Set(data.members.map(m => m.id));
  const mainIds = new Set(data.main.flat().filter(id => id && validIds.has(id)));
  const subEligible = data.members.filter(m => !mainIds.has(m.id));
  const eligibleIds = new Set(subEligible.map(m => m.id));

  // Keep only valid non-Main members already placed in SUB, remove duplicates.
  const seen = new Set();
  const kept = [];
  (Array.isArray(data.sub) ? data.sub : []).forEach(team => {
    const clean = Array(5).fill(null);
    for(let i=0;i<5;i++){
      const id = team?.[i];
      if(id && eligibleIds.has(id) && !seen.has(id)){
        clean[i] = id;
        seen.add(id);
      }
    }
    kept.push(clean);
  });

  // SUB must have enough EMPTY capacity for everyone outside Main,
  // but members are NOT auto-assigned. Officers can build teams manually.
  const needed = Math.max(1, Math.ceil(subEligible.length / 5));
  while(kept.length < needed) kept.push(Array(5).fill(null));
  while(kept.length > needed && kept[kept.length-1].every(x => !x)) kept.pop();
  data.sub = kept;
}

  const field = data[current];

  // Count UNIQUE valid members in Main/Sub. Old or duplicate slot IDs do not inflate totals.
  const mainIds = new Set(
    data.main.flat().filter(id => id && validMemberIds.has(id))
  );
  const subIds = new Set(
    data.sub.flat().filter(id => id && validMemberIds.has(id))
  );
  const assignedAnywhere = new Set([...mainIds, ...subIds]);
  const unassigned = Math.max(0, data.members.length - assignedAnywhere.size);

  let fullTeams = 0;
  let noHealer = 0;

  field.forEach(team => {
    const membersInTeam = [...new Set(team)]
      .filter(id => id && validMemberIds.has(id))
      .map(id => data.members.find(m => m.id === id))
      .filter(Boolean);

    if(membersInTeam.length === 5) fullTeams++;
    if(membersInTeam.length > 0 && !membersInTeam.some(m => m.cls === "High Priest")) noHealer++;
  });

  const statMembers = document.getElementById("statMembers");
  const statMain = document.getElementById("statMain");
  const statSub = document.getElementById("statSub");

  const statFullTeams = document.getElementById("statFullTeams");

function localDateISO(d=new Date()){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,"0");
  const day = String(x.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function attendanceHistoryStats(){
  const dates = Object.keys(data.attendance || {}).sort();
  const absentCounts = new Map(data.members.map(m => [String(m.id),0]));
  const presentCounts = new Map(data.members.map(m => [String(m.id),0]));
  const markedCounts = new Map(data.members.map(m => [String(m.id),0]));

  dates.forEach(date => {
    const rec = data.attendance[date] || {};
    data.members.forEach(m => {
      const v = rec[String(m.id)];
      if(v === "present"){
        presentCounts.set(String(m.id), (presentCounts.get(String(m.id))||0)+1);
        markedCounts.set(String(m.id), (markedCounts.get(String(m.id))||0)+1);
      }else if(v === "absent"){
        absentCounts.set(String(m.id), (absentCounts.get(String(m.id))||0)+1);
        markedCounts.set(String(m.id), (markedCounts.get(String(m.id))||0)+1);
      }
    });
  });

  const perfect = data.members.filter(m => {
    const id = String(m.id);
    return (markedCounts.get(id)||0) > 0 && (absentCounts.get(id)||0) === 0;
  }).length;

  return { dates, absentCounts, presentCounts, markedCounts, perfect };
}

  const selectedClass = classSelect?.value || "all";
  const history = attendanceHistoryStats();

  let present=0, absent=0;
  data.members.forEach(m => {
    const v = rec[String(m.id)];

    else if(v === "absent") absent++;
  });
  const unmarked = Math.max(0, data.members.length - present - absent);

  const rows = [...data.members]
    .filter(m => selectedClass === "all" || m.cls === selectedClass)

    .sort((a,b) => a.cls.localeCompare(b.cls) || a.name.localeCompare(b.name));

  list.innerHTML = rows.map(m => {
    const status = rec[String(m.id)] || "unmarked";
    const statusText = status === "present" ? "PRESENT" : status === "absent" ? "ABSENT" : "UNMARKED";
    return `
      <div class="attendanceRow">
        <div class="attendanceMember">
          <strong>${escapeHtml(m.name)}</strong>
          <small><span class="class-${m.cls.replaceAll(' ','-')}">${escapeHtml(m.cls)}</span> • ${Number(m.gr||0).toLocaleString()} GR</small>
        </div>
        <div class="attendanceStatus ${status}">${statusText}</div>
        <div class="attendanceActions">
          ${isOfficer ? `
          <button class="presentBtn ${status==='present'?'active':''}" onclick="setAttendance(${m.id},'present')">✓ Present</button>
          <button class="absentBtn ${status==='absent'?'active':''}" onclick="setAttendance(${m.id},'absent')">✕ Absent</button>
          <button onclick="setAttendance(${m.id},null)">Clear</button>` : `<span class="viewOnlyBadge">🔒 View only</span>`}
        </div>
      </div>`;
  }).join("") || '<div style="padding:14px;opacity:.7">No members found.</div>';

  const missed = data.members
    .map(m => ({m,count:history.absentCounts.get(String(m.id))||0}))
    .filter(x => x.count > 0)
    .sort((a,b) => b.count-a.count || a.m.name.localeCompare(b.m.name));

  missedGrid.innerHTML = missed.length
    ? missed.map(x => `<div class="missedItem"><strong>${escapeHtml(x.m.name)}</strong><span>${x.count} missed</span></div>`).join("")
    : '<div style="opacity:.7;padding:8px">No recorded absences yet.</div>';
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function pick(id){
  if(!requireOfficer()) return;
  selected=id;
  render();
  if(window.innerWidth<=700) closeMemberPool();
}

function assign(t,s){
  if(!requireOfficer()) return;
  if(!selected)return;

  const selectedId = selected;
  const targetId = data[current][t][s];
  const targetMember = data.members.find(m => m.id === targetId);

  // Find where the selected member is currently assigned.
  let oldSpot = null;
  ["main","sub"].forEach(field => {
    data[field].forEach((team,ti) => {
      team.forEach((id,si) => {
        if(id === selectedId) oldSpot = { field, ti, si };
      });
    });
  });

  // If target is occupied, swap only when selected member already has a slot.
  // An unassigned member cannot overwrite an occupied slot by accident.
  if(targetId && targetMember){
    if(!oldSpot || targetId === selectedId) return;

    data[oldSpot.field][oldSpot.ti][oldSpot.si] = targetId;
    data[current][t][s] = selectedId;
    selected = null;
    save();
    return;
  }

  // Normal move: clear old assignment first, then place in target slot.
  if(oldSpot){
    data[oldSpot.field][oldSpot.ti][oldSpot.si] = null;
  }

  data[current][t][s] = selectedId;
  selected = null;
  save();
}

function removeSlot(e,t,s){
  if(!requireOfficer()) return;
e.stopPropagation();
data[current][t][s]=null;
save();
}

function showTab(tab){
current=tab;
mainBtn.classList.toggle("active",tab==="main");
subBtn.classList.toggle("active",tab==="sub");
const clearBtn = document.getElementById("clearCurrentBtn");
if(clearBtn) clearBtn.textContent = tab === "main" ? "Clear Main" : "Clear Sub";
render();
}

function clearCurrent(){
  if(!requireOfficer()) return;
  if(current === "main"){
    if(!confirm("Clear all 60 Main Battlefield slots?")) return;
    data.main = Array.from({length:12},()=>Array(5).fill(null));
    selected = null;
    reconcileSubRoster();
    save();
    return;
  }

  if(!confirm("Clear ALL Sub team slots? The Sub teams will stay available, but every member will return to the Sub Pool so you can rebuild from scratch.")) return;
  const validIds = new Set(data.members.map(m => m.id));
  const mainIds = new Set(data.main.flat().filter(id => id && validIds.has(id)));
  const subEligibleCount = data.members.filter(m => !mainIds.has(m.id)).length;
  const needed = Math.max(1, Math.ceil(subEligibleCount / 5));
  data.sub = Array.from({length:needed},()=>Array(5).fill(null));
  selected = null;
  save();
}

function autoFillCurrent(){
  if(!requireOfficer()) return;
  if(!confirm(`Auto-fill empty slots in ${current === "main" ? "Main" : "Sub"} Battlefield? Existing assignments will stay.`)) return;

  // SUB auto-fill: place everyone outside Main into Sub teams, highest GR first.
  if(current === "sub") {
    reconcileSubRoster();
    const usedSub = new Set(data.sub.flat().filter(Boolean));
    const mainIds = new Set(data.main.flat().filter(Boolean));
    const availableSub = data.members
      .filter(m => !mainIds.has(m.id) && !usedSub.has(m.id))
      .sort((a,b) => b.gr - a.gr);

    for(const m of availableSub){
      let placed = false;
      for(const team of data.sub){
        const slot = team.indexOf(null);
        if(slot !== -1){ team[slot] = m.id; placed = true; break; }
      }
      if(!placed) data.sub.push([m.id,null,null,null,null]);
    }
    save();
    return;
  }

  // MAIN auto-fill must be allowed to pull members FROM SUB.
  // Only members already in MAIN are considered unavailable.
  const usedMain = new Set(data.main.flat().filter(Boolean));
  let available = data.members.filter(m => !usedMain.has(m.id));

  // Highest GR first. Keep High Priests easy to place as one healer per team.
  available.sort((a,b) => b.gr - a.gr);
  const priests = available.filter(m => m.cls === "High Priest");
  const others = available.filter(m => m.cls !== "High Priest");

  const field = data.main;

  // First pass: put one High Priest into each team that does not already have one.
  field.forEach(team => {
    const currentMembers = team.map(id => data.members.find(m => m.id === id)).filter(Boolean);
    const hasPriest = currentMembers.some(m => m.cls === "High Priest");
    if(!hasPriest && priests.length){
      const emptyIndex = team.findIndex(id => !id || !data.members.some(m => m.id === id));
      if(emptyIndex !== -1) team[emptyIndex] = priests.shift().id;
    }
  });

  // Second pass: fill remaining MAIN slots by highest GR.
  const remaining = [...priests, ...others].sort((a,b) => b.gr - a.gr);
  field.forEach(team => {
    for(let i=0;i<team.length && remaining.length;i++){
      const valid = team[i] && data.members.some(m => m.id === team[i]);
      if(!valid) team[i] = remaining.shift().id;
    }
  });

  // save() calls reconcileSubRoster(), which automatically removes
  // newly selected MAIN members from SUB and repacks the rest.
  save();
}

function safeFileName(text){
  return text.replace(/[^a-z0-9_-]+/gi, "-").replace(/^-+|-+$/g, "");
}

async function saveTeamImage(){
  const btn = document.getElementById("saveTeamImageBtn");
  const teams = document.getElementById("teams");
  if(!teams || typeof html2canvas === "undefined"){
    alert("Image tool is still loading. Please try again in a moment.");
    return;
  }

  const oldText = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "📸 Creating image…"; }

  try{
    const canvas = await html2canvas(teams, {
      backgroundColor: "#0b0f16",
      scale: Math.min(2, window.devicePixelRatio || 1.5),
      useCORS: true,
      logging: false,
      width: teams.scrollWidth,
      height: teams.scrollHeight,
      windowWidth: Math.max(document.documentElement.clientWidth, teams.scrollWidth),
      windowHeight: Math.max(document.documentElement.clientHeight, teams.scrollHeight)
    });

    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png", 1));
    if(!blob) throw new Error("Could not create PNG");

    const label = current === "main" ? "Main-Battlefield" : "Sub-Battlefield";
    const filename = safeFileName(`Numbers-${label}`) + ".png";
    const file = new File([blob], filename, {type:"image/png"});

    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      try{
        await navigator.share({files:[file], title:"Numbers", text:`${current === "main" ? "Main" : "Sub"} Battlefield lineup`});
        return;
      }catch(err){
        if(err && err.name === "AbortError") return;
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }catch(err){
    console.error("Save image error:", err);
    alert("Hindi nagawa ang team image. Try ulit after refresh.");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = oldText || "📸 Save Team Image"; }
  }
}

function toggleDesktopPool(){
  if(window.innerWidth <= 700){
    toggleMemberPool();
    return;
  }
  document.body.classList.toggle("poolHiddenDesktop");
}

function toggleMemberPool(){
  document.body.classList.toggle("memberPoolOpen");
}

function closeMemberPool(){
  document.body.classList.remove("memberPoolOpen");
}

// Show cached/local data immediately so the page feels instant.
reconcileSubRoster();
render();

async function startCloudSync(){
  // Load team assignments first, then refresh roster from Google Sheet.
  await loadCloudData();
  await syncRosterFromSheet(false);

  // Keep other officers/devices in sync in realtime.
  supabaseClient
    .channel("guild-data-sync")
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "guild_data",
        filter: "id=eq.1"
      },
      payload => {
        if (payload.new && payload.new.data) {
          const incoming = JSON.stringify(payload.new.data);
          const currentData = JSON.stringify(data);

          // Avoid an unnecessary full re-render when nothing changed.
          if (incoming !== currentData) {
            data = payload.new.data;
            reconcileSubRoster();
            localStorage.setItem("gcc", JSON.stringify(data));
            render();
            syncRosterFromSheet(false);
          }
        }
      }
    )
    .subscribe();
}

// Let the browser paint the UI first, then start network work.
if ("requestIdleCallback" in window) {
  requestIdleCallback(startCloudSync, { timeout: 700 });
} else {
  setTimeout(startCloudSync, 80);
}
</script>
