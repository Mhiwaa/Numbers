<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guild Command Center</title>
<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f16;
  color:#f5f7fb;
}

body.memberPoolOpen{overflow:hidden;}

header{
  padding:14px 18px;
  background:#101722;
  border-bottom:1px solid #273244;
  position:sticky;
  top:0;
  z-index:20;
}

h2,h3{margin:8px 0;}

.wrap{
  padding:12px;
  max-width:1500px;
  margin:auto;
  display:grid;
  grid-template-columns:340px minmax(0,1fr);
  gap:12px;
  align-items:start;
}

.panel{
  background:#121a26;
  border:1px solid #273244;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

#rosterPanel{
  position:sticky;
  top:82px;
  max-height:calc(100vh - 96px);
  display:flex;
  flex-direction:column;
  margin-bottom:0;
}

.rosterHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.closeRosterBtn,
.memberPoolBtn,
.drawerBackdrop{
  display:none;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
}

.bulkUpdate{
  display:flex;
  gap:7px;
  align-items:stretch;
  margin:7px 0;
}

.bulkUpdate textarea{
  flex:1;
  min-width:0;
  min-height:62px;
  resize:vertical;
  background:#1a2330;
  color:#f5f7fb;
  border:1px solid #334155;
  border-radius:8px;
  padding:9px 11px;
}

input,select,button{
  background:#1a2330;
  color:#f5f7fb;
  border:1px solid #334155;
  border-radius:8px;
  padding:9px 11px;
}

input::placeholder,.bulkUpdate textarea::placeholder{color:#718096;}
button{cursor:pointer;}
button:hover{background:#243247;}

#members{
  display:flex;
  flex-direction:column;
  gap:4px;
  max-height:calc(100vh - 390px);
  min-height:180px;
  overflow-y:auto;
  padding:6px 2px;
  margin-top:4px;
}

.member{
  width:100%;
  min-width:0;
  background:#182230;
  border:1px solid #2d3b50;
  border-radius:7px;
  padding:7px 8px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:6px;
}

.member.sel{
  outline:2px solid #4da3ff;
  background:#172b42;
}

.member small{color:#9aa7b8;}
.class-Lord-Knight{color:#ff7676!important;}
.class-Paladin{color:#ffd166!important;}
.class-High-Wizard{color:#70a1ff!important;}
.class-High-Priest{color:#ff8ed4!important;}
.class-Sniper{color:#7bed9f!important;}
.class-Assassin-Cross{color:#c792ea!important;}
.class-Whitesmith{color:#ffa502!important;}
.class-Nightwatch{color:#74b9ff!important;}
.class-Alithea{color:#55efc4!important;}
.class-Champion{color:#ffb86c!important;}

.memberBtns{display:flex;gap:3px;margin-top:0;}
.memberBtns button{padding:5px 8px;font-size:11px;}

.memberStatus{
  display:inline-block;
  margin-top:4px;
  padding:2px 6px;
  border-radius:10px;
  font-size:10px;
  font-weight:bold;
}
.statusMain{background:#1e4f80;color:#8ecbff;}
.statusSub{background:#4a3275;color:#d2b6ff;}
.statusNone{background:#303846;color:#aab4c3;}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.tabs button.active{
  background:#4da3ff;
  color:#07111f;
  border-color:#4da3ff;
  font-weight:bold;
}

.teams{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.team{
  background:#101722;
  border:1px solid #2b3748;
  border-radius:12px;
  padding:9px;
}
.teamHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:2px 3px 8px;
  font-size:14px;
}
.teamHeader span{color:#65d68a;font-size:12px;font-weight:bold;}
.slot{
  background:#182230;
  border:1px solid #2c394c;
  border-radius:7px;
  min-height:32px;
  margin:3px 0;
  padding:5px 7px;
}
.slot b{font-size:13px;}
.slot small{color:#9aa7b8;font-size:11px;}
.slot button{padding:5px 7px;font-size:11px;margin-top:4px;}

@media(max-width:700px){
  header{padding:10px 12px;}
  header h2{font-size:18px;}

  .wrap{
    padding:8px;
    display:block;
  }

  .memberPoolBtn{
    display:inline-block;
    margin-bottom:8px;
  }

  .drawerBackdrop{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }

  body.memberPoolOpen .drawerBackdrop{
    opacity:1;
    pointer-events:auto;
  }

  #rosterPanel{
    position:fixed;
    top:0;
    left:0;
    width:min(84vw,340px);
    height:100dvh;
    max-height:none;
    margin:0;
    padding:12px;
    overflow:hidden;
    z-index:1000;
    transform:translateX(-105%);
    transition:transform .22s ease;
    border-radius:0 14px 14px 0;
    box-shadow:12px 0 30px rgba(0,0,0,.35);
  }

  body.memberPoolOpen #rosterPanel{transform:translateX(0);}

  .closeRosterBtn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    padding:0;
    font-size:18px;
    flex:0 0 auto;
  }

  #rosterPanel .controls input,
  #rosterPanel .controls select{
    flex:1 1 calc(50% - 7px);
    min-width:0;
    max-width:none;
  }

  #rosterPanel .controls button{
    flex:0 0 auto;
  }

  #rosterPanel .bulkUpdate{
    flex-direction:column;
  }

  #rosterPanel .bulkUpdate textarea{
    width:100%;
    min-height:54px;
  }

  #members{
    flex:1;
    min-height:0;
    max-height:none;
    overflow-y:auto;
    overscroll-behavior:contain;
  }

  .member{
    grid-template-columns:minmax(0,1fr) auto;
  }

  .memberBtns button{
    padding:5px 7px;
    font-size:10px;
  }

  .panel{padding:9px;}
  .teams{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
  .team{padding:6px;}
  .teamHeader{font-size:12px;}
  .slot{min-height:48px;padding:7px;}
}

@media(max-width:420px){
  .teams{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
<h2>⚔️ Guild Command Center</h2>
</header>

<div class="wrap">
<button class="memberPoolBtn" onclick="toggleMemberPool()">☰ Member Pool</button>
<div class="drawerBackdrop" onclick="closeMemberPool()"></div>
<div class="panel" id="rosterPanel">
<div class="rosterHeader">
  <h3>Roster</h3>
  <button class="closeRosterBtn" onclick="closeMemberPool()" aria-label="Close Member Pool">✕</button>
</div>

<div class="controls">
<input id="name" placeholder="IGN">

<select id="cls">
<option>Lord Knight</option>
<option>Paladin</option>
<option>High Wizard</option>
<option>High Priest</option>
<option>Sniper</option>
<option>Assassin Cross</option>
<option>Whitesmith</option>
<option>Nightwatch</option>
<option>Alithea</option>
<option>Champion</option>
</select>

<input id="gr" type="number" placeholder="Gear Rating">
<button onclick="saveMember()">Add Member</button>
</div>
<div class="bulkUpdate">
  <textarea id="rosterPaste" placeholder="Paste Class | IGN | Gear Rating from Google Sheets"></textarea>
  <button onclick="bulkUpdateRoster()">Update Roster</button>
</div>
<div class="controls">
<input id="search" placeholder="Search IGN" oninput="render()">

<select id="filter" onchange="render()">
<option value="">All Classes</option>
<option>Lord Knight</option>
<option>Paladin</option>
<option>High Wizard</option>
<option>High Priest</option>
<option>Sniper</option>
<option>Assassin Cross</option>
<option>Whitesmith</option>
<option>Nightwatch</option>
<option>Alithea</option>
<option>Champion</option>
</select>

<select id="sort" onchange="render()">
<option value="gr">Highest GR</option>
<option value="az">A-Z</option>
</select>
</div>

<div id="members"></div>
</div>

<div class="panel">
<div class="tabs">
<button id="mainBtn" class="active" onclick="showTab('main')">Main Battlefield</button>
<button id="subBtn" onclick="showTab('sub')">Sub Battlefield</button>
<button onclick="clearCurrent()">Clear Current</button>
</div>
<div id="loginBox" class="panel">
  <h3>Officer Login</h3>
  <input id="loginEmail" type="email" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button onclick="officerLogin()">Login</button>
  <button onclick="officerLogout()">Logout</button>
  <span id="loginStatus">Not logged in</span>
</div>

<div class="teams" id="teams"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://wgiibguqueuwetrmxixa.supabase.co";
const SUPABASE_KEY = "sb_publishable_UJR0HaAeyOmv0-lL5yFMYg_iXyH3BCN";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function officerLogin(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert("Login failed: " + error.message);
    return;
  }

  document.getElementById("loginStatus").textContent = "Logged in";
  alert("Login successful!");
}

async function officerLogout(){
  await supabaseClient.auth.signOut();
  document.getElementById("loginStatus").textContent = "Not logged in";
}
const classes=[
"Lord Knight","Paladin","High Wizard","High Priest","Sniper",
"Assassin Cross","Whitesmith","Nightwatch","Alithea","Champion"
];

let data=JSON.parse(localStorage.getItem("gcc"))||{
members:[],
main:Array.from({length:12},()=>Array(5).fill(null)),
sub:Array.from({length:12},()=>Array(5).fill(null))
};

let selected=null;
let editing=null;
let current="main";

async function save(){
  localStorage.setItem("gcc", JSON.stringify(data));
  render();

  const { error } = await supabaseClient
    .from("guild_data")
    .upsert(
      { id: 1, data: data },
      { onConflict: "id" }
    );

  if(error){
    console.error("Supabase save error:", error);
    alert("Cloud save failed: " + error.message);
  }
}
async function loadCloudData(){
  const { data: row, error } = await supabaseClient
    .from("guild_data")
    .select("data")
    .eq("id", 1)
    .maybeSingle();

  if(error){
    console.error("Cloud load error:", error);
    return;
  }

  if(row && row.data){
    data = row.data;
    localStorage.setItem("gcc", JSON.stringify(data));
    render();
  }
}
function saveMember(){
  const nameInput = document.getElementById("name");
  const classInput = document.getElementById("cls");
  const grInput = document.getElementById("gr");

  let n = nameInput.value.trim();
  let c = classInput.value;
  let g = Number(grInput.value) || 0;

  if(!n) return alert("Enter IGN");

  if(editing){
    let m = data.members.find(x => x.id === editing);
    m.name = n;
    m.cls = c;
    m.gr = g;
    editing = null;
  } else {
    data.members.push({
      id: Date.now() + Math.random(),
      name: n,
      cls: c,
      gr: g
    });
  }

  nameInput.value = "";
  grInput.value = "";
  save();
}
function bulkUpdateRoster(){
  const text = document.getElementById("rosterPaste").value.trim();

  if(!text){
    alert("Paste your roster first.");
    return;
  }

  const rows = text.split(/\r?\n/);
  let updated = 0;
  let added = 0;

  rows.forEach(row => {
    const cols = row.split("\t");

    if(cols.length < 3) return;

    const cls = cols[0].trim();
    const name = cols[1].trim();
    const gr = Number(cols[2].replace(/,/g, "").trim());

    if(!name || !cls || isNaN(gr)) return;

    // Skip header row
    if(name.toLowerCase() === "ign") return;

    const existing = data.members.find(
      m => m.name.toLowerCase() === name.toLowerCase()
    );

    if(existing){
      existing.cls = cls;
      existing.gr = gr;
      updated++;
    }else{
      data.members.push({
        id: Date.now() + Math.random(),
        name: name,
        cls: cls,
        gr: gr
      });
      added++;
    }
  });

  document.getElementById("rosterPaste").value = "";
  save();

  alert(`Roster updated!\n${updated} updated\n${added} new members added`);
  }
function editMember(id){
  let m = data.members.find(x => x.id === id);

  document.getElementById("name").value = m.name;
  document.getElementById("cls").value = m.cls;
  document.getElementById("gr").value = m.gr;

  editing = id;
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteMember(id){
if(!confirm("Delete this member?"))return;

data.members=data.members.filter(x=>x.id!==id);

["main","sub"].forEach(k=>{
data[k].forEach(t=>{
for(let i=0;i<t.length;i++){
if(t[i]===id)t[i]=null;
}
});
});

if(selected===id)selected=null;
save();
}

function usedIds(){
return new Set([
...data.main.flat(),
...data.sub.flat()
].filter(Boolean));
}

function memberStatus(id){
  for(let t = 0; t < data.main.length; t++){
    if(data.main[t].includes(id)){
      return `MAIN T${t + 1}`;
    }
  }

  for(let t = 0; t < data.sub.length; t++){
    if(data.sub[t].includes(id)){
      return `SUB T${t + 1}`;
    }
  }

  return "UNASSIGNED";
}

function renderMembers(){
  let q = search.value.toLowerCase();
  let f = filter.value;
  let s = sort.value;

  // Show ALL members, including assigned members
  let arr = [...data.members];

  if(q) arr = arr.filter(x =>
    x.name.toLowerCase().includes(q)
  );

  if(f) arr = arr.filter(x =>
    x.cls === f
  );

  arr.sort((a,b)=>{
    if(s === "az") return a.name.localeCompare(b.name);
    return b.gr - a.gr;
  });

  members.innerHTML = arr.map(m => {
    const status = memberStatus(m.id);

    return `
      <div class="member ${selected===m.id?'sel':''}" onclick="pick(${m.id})">
        <b>${m.name}</b><br>

        <small class="class-${m.cls.replaceAll(' ','-')}">
          ${m.cls} • GR ${m.gr.toLocaleString()}
        </small>

        <span class="memberStatus ${status.startsWith('MAIN') ? 'statusMain' : status.startsWith('SUB') ? 'statusSub' : 'statusNone'}">${status}</span>

        <div class="memberBtns">
          <button onclick="pick(${m.id})">Select</button>
          <button onclick="editMember(${m.id})">Edit</button>
          <button onclick="deleteMember(${m.id})">Delete</button>
        </div>
      </div>
    `;
  }).join("");
}

function renderTeams(){
  let field = data[current];

  teams.innerHTML = field.map((team,ti)=>{
    const filled = team.filter(id =>
      data.members.some(m => m.id === id)
    ).length;

    return `
      <div class="team">
        <div class="teamHeader">
          <b>${current==="main" ? "Main" : "Sub"} Team ${ti+1}</b>
          <span>${filled}/5</span>
        </div>

        ${team.map((id,si)=>{
          let m = data.members.find(x => x.id === id);

          return `
            <div class="slot">
              ${m ? `
                <b>${m.name}</b><br>
                <small class="class-${m.cls.replaceAll(' ','-')}">${m.cls} • GR ${m.gr.toLocaleString()}</small>
                <br>
                <button onclick="removeSlot(event,${ti},${si})">Remove</button>
              ` : `
                <button onclick="assign(${ti},${si})">＋ Empty slot</button>
              `}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }).join("");
}

function render(){
renderMembers();
renderTeams();
}

function pick(id){
  selected=id;
  render();
  if(window.innerWidth<=700) closeMemberPool();
}

function assign(t,s){
  if(!selected)return;

  const existingId = data[current][t][s];
  const existingMember = data.members.find(m => m.id === existingId);
  if(existingId && existingMember)return;

  ["main","sub"].forEach(field => {
    data[field].forEach(team => {
      for(let i=0;i<team.length;i++){
        if(team[i]===selected) team[i]=null;
      }
    });
  });

  data[current][t][s]=selected;
  selected=null;
  save();
}

function removeSlot(e,t,s){
e.stopPropagation();
data[current][t][s]=null;
save();
}

function showTab(tab){
current=tab;
mainBtn.classList.toggle("active",tab==="main");
subBtn.classList.toggle("active",tab==="sub");
render();
}

function clearCurrent(){
if(!confirm("Clear all teams in this battlefield?"))return;
data[current]=Array.from({length:12},()=>Array(5).fill(null));
save();
}

function toggleMemberPool(){
  document.body.classList.toggle("memberPoolOpen");
}

function closeMemberPool(){
  document.body.classList.remove("memberPoolOpen");
}

render();
loadCloudData();

supabaseClient
  .channel("guild-data-sync")
  .on(
    "postgres_changes",
    {
      event: "UPDATE",
      schema: "public",
      table: "guild_data",
      filter: "id=eq.1"
    },
    payload => {
      if (payload.new && payload.new.data) {
        data = payload.new.data;
        localStorage.setItem("gcc", JSON.stringify(data));
        render();
      }
    }
  )
  .subscribe();
</script>
</body>
</html>
